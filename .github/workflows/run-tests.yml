name: Run Tests
run-name: Run Tests triggered by ${{ github.ref_type }} ${{ github.ref_name }} or ${{ github.triggering_actor }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "21 11 * * 0"

jobs:
  lint:
    name: Lint rms-spyceman
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      # Runs the "F" rules selected in [tool.ruff.lint] in pyproject.toml, matching
      # `--ruff-check` in scripts/run-all-checks.sh. `ruff format` is deliberately not
      # run: the house style is column-aligned and the formatter would reflow it.
      - name: Ruff
        run: |
          ruff check src tests programs

      # Ruff implements no rule in the E121-E133 range, so continuation-line
      # indentation is the one pycodestyle family it cannot gate. This step matches
      # `--flake8-cont` in scripts/run-all-checks.sh and reads .flake8.
      - name: Flake8 continuation-line indent
        run: |
          flake8 --select=E12,E13 src tests programs

      - name: Pyroma
        run: |
          pyroma .

      # -W makes warnings errors. docs/conf.py leaves nitpicky = False for now, so
      # unresolved cross-references do not fail the build yet.
      - name: Sphinx
        run: |
          sphinx-build -W -b html docs docs/_build

      - name: PyMarkdown
        run: |
          pymarkdown scan docs/ README.md CONTRIBUTING.md

  test:
    name: Test rms-spyceman
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Test with coverage
        run: |
          python -m pytest --cov=src --cov-report=xml -n auto tests

      - name: Print coverage report
        run: |
          coverage report -m

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v6
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && !github.event.pull_request.head.repo.fork
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
