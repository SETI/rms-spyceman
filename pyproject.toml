[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-spyceman"
dynamic = ["version"]
description = "Kernel manager for the SPICE toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cspyce",
  "numpy",
  "portion",
  "requests",
  "rms-julian",
  "rms-textkernel",
]
license = {text = "Apache-2.0"}
authors = [
  {name = "Ring-Moon Systems Node, SETI Institute", email = "matt@seti.org"}
]
maintainers = [
  {name = "Ring-Moon Systems Node, SETI Institute", email = "matt@seti.org"}
]
keywords = ["spyceman", "spice", "kernel", "naif", "ephemeris"]
classifiers = [
  # Downgrade once the package imports cleanly and has a released version.
  "Development Status :: 2 - Pre-Alpha",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows"
]

[project.urls]
Homepage = "https://github.com/SETI/rms-spyceman"
Documentation = "https://rms-spyceman.readthedocs.io/en/latest"
Repository = "https://github.com/SETI/rms-spyceman"
Source = "https://github.com/SETI/rms-spyceman"
Issues = "https://github.com/SETI/rms-spyceman/issues"

[tool.pytest.ini_options]
pythonpath = [
  "src",
  # programs/ is not packaged, but tests/test_ktupler.py exercises the generator that
  # emits the machine-generated KTuple tables.
  "programs",
]
testpaths = ["tests"]
addopts = ["-n", "auto", "--cov=src/spyceman", "--strict-markers", "--strict-config",
           "-m", "not slow"]
markers = [
  # The tests that import a full kernel catalog are the slowest the suite has, so they
  # are deselected by default. Run them with `pytest -m slow`.
  "slow: imports a full kernel catalog; seconds rather than milliseconds",
]
# Importing a host or solarsystem module issues warnings.warn() for unrecognized NAIF
# bodies, so warnings are not errors here the way they are in rms-polymath.
filterwarnings = ["default"]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/spyceman/_version.py"

[project.optional-dependencies]
dev = [
  "coverage>=7.0",
  "flake8",
  "pip-audit>=2.7",
  "pymarkdownlnt>=0.9.35",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.8",
  "pyroma>=4.2",
  "rms-spyceman[docs]",
]
docs = [
  "myst-parser",
  "sphinx>=7",
  "sphinxcontrib-mermaid",
  "sphinx-rtd-theme",
]

# Tool configuration

[tool.coverage.run]
branch = true
parallel = true
# Must match --cov in the pytest addopts above, or fail_under measures something else
source = ["src/spyceman"]
omit = ["tests/*", "_version.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
]
# A floor, not a target. The behavioral tests for kernel selection put the whole suite
# near 36%; this sits below that so ordinary work does not trip it, while a collapse in
# coverage still fails the build. Raise it toward rms-polymath's 90 as tests land.
fail_under = 30

[tool.ruff]
target-version = "py311"
# rms-polymath pins this to max-line-length in .flake8. This repo's .flake8 disables
# E501 outright, but 90 is the de-facto limit: the banner comments are 90 characters
# wide and the source is written to them.
line-length = 90
exclude = [
  # Machine-generated KTuple tables emitted by programs/ktupler.py. They are
  # regenerated, not edited, so linting them would only produce noise. The second
  # character must be a letter or digit rather than another underscore: "*" is a glob
  # wildcard here, not a repeat of the class before it, so "_[A-Z0-9_]*.py" also matched
  # every __init__.py and quietly left all six of them unlinted.
  "src/spyceman/**/_[A-Z0-9][A-Z0-9_]*.py",
  # Written by setuptools_scm at build time.
  "src/spyceman/_version.py",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# ---------------------------------------------------------------------------------------
# "F" (Pyflakes) only, for now.
#
# F finds undefined names and unused imports and nothing else. That is precisely the
# failure mode the 2026-08-16 review was dominated by -- an attribute or import renamed in
# one place and not another -- and switching it on immediately found a live one: a
# warnings.warn() call in _kernelinfo.py whose module never imported warnings.
#
# The wider set was measured before choosing this. Enabling E,W,I,UP,B,SIM,C4,A,N,PT,RUF
# reports 177 more, and most of the large groups conflict with the house style rather than
# describing defects: E402 (21) is deliberate, since imports appear mid-file right before
# first use; N999/N801/N802 name the deliberately capitalized host and body modules and
# the lowercase descriptor classes; I001 (24) would reorder the column-aligned import
# blocks that .flake8 exists to preserve. Adding a category means fixing or ignoring its
# findings first, and an ignore list must be re-derived from a clean run rather than
# copied from the one that used to live here.
#
# Categories available: E, W = pycodestyle; F = Pyflakes; I = isort; UP = pyupgrade;
# B = bugbear; SIM = simplify; C4 = comprehensions; A = builtins; N = pep8-naming;
# PT = pytest-style; RUF = Ruff-specific.
# ---------------------------------------------------------------------------------------
select = ["F"]

# Permanently disabled, by maintainer decision. These are not deferred work and are not to
# be "re-derived from a clean run" like the deleted per-file-ignores: both describe the
# house style, so they stay off whatever else `select` grows to include. Listing them here
# rather than relying on their absence from `select` is what makes the decision durable.
#
#   E741  Ambiguous variable name (`l`). Already permanently ignored in .flake8, so
#         disabling it here keeps the two linters consistent rather than having ruff
#         object to what flake8 is configured to allow.
#   I001  Unsorted imports. Import blocks in this package are aligned in columns and
#         grouped by purpose, which isort would reflow. See "Code style" in CLAUDE.md.
ignore = ["E741", "I001"]

[tool.pymarkdown.plugins.md013]
# Line length (disable so README/CONTRIBUTING can use longer lines).
enabled = false

[tool.pymarkdown.plugins.md033]
# Inline HTML (e.g. <br>) allowed in Markdown.
enabled = false

[tool.pymarkdown.plugins.md025]
# Multiple top-level headings.
enabled = false

[tool.pymarkdown.plugins.md041]
# First line must be a top-level heading.
enabled = false

[tool.pymarkdown.plugins.md046]
# Code block style. The README indents its examples by eight spaces rather than
# fencing them, and the README is not being modified.
enabled = false

# The four rules below are disabled only because README.md and CONTRIBUTING.md predate
# this configuration and were not modified in this pass. Re-enable each one after
# reformatting those two files.

[tool.pymarkdown.plugins.md009]
# Trailing spaces (CONTRIBUTING.md:102).
enabled = false

[tool.pymarkdown.plugins.md012]
# Multiple consecutive blank lines. Both files use two blank lines before every
# heading, and README.md has a six-line gap at line 76.
enabled = false

[tool.pymarkdown.plugins.md022]
# Blank lines around headings; the same two-blank-line habit as above.
enabled = false

[tool.pymarkdown.plugins.md032]
# Blank lines around lists (CONTRIBUTING.md:8).
enabled = false
